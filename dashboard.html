<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishnan Subramaniam Iyer — Attendance</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf6ef;
    --card: #fffaf5;
    --border: #e8d9c8;
    --brown: #6b4226;
    --brown-light: #9c6644;
    --cream: #f5e6d3;
    --warm-red: #c94f2c;
    --warm-green: #5a7a4a;
    --warm-yellow: #c48a2a;
    --text: #3d2b1a;
    --muted: #9a7b65;
    --shadow: 0 2px 16px rgba(107,66,38,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 10% 0%, rgba(196,138,42,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 100%, rgba(201,79,44,0.08) 0%, transparent 50%);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 48px 24px;
  }

  .wrap { max-width: 780px; margin: 0 auto; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 48px;
    padding-bottom: 28px;
    border-bottom: 1.5px solid var(--border);
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 900;
    color: var(--brown);
    letter-spacing: -0.01em;
  }

  .logo em {
    font-style: normal;
    color: var(--warm-red);
  }

  .badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--warm-green);
    background: #eef4e8;
    border: 1px solid #c8ddb8;
    border-radius: 100px;
    padding: 5px 14px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--warm-green);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.5; transform:scale(0.8); }
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 40px;
  }

  .stat {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 22px 20px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .stat::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 16px 16px 0 0;
  }

  .stat.total::before { background: var(--warm-yellow); }
  .stat.week::before  { background: var(--warm-green); }
  .stat.fail::before  { background: var(--warm-red); }

  .stat-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .stat-value {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.03em;
  }

  .stat.total .stat-value { color: var(--warm-yellow); }
  .stat.week  .stat-value { color: var(--warm-green); }
  .stat.fail  .stat-value { color: var(--warm-red); }

  .section-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .log-list { display: flex; flex-direction: column; gap: 10px; }

  .entry {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 18px 22px;
    display: grid;
    grid-template-columns: 36px 1fr auto;
    gap: 16px;
    align-items: center;
    box-shadow: var(--shadow);
    transition: border-color 0.2s;
  }

  .entry:hover { border-color: var(--brown-light); }

  .icon-wrap {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }

  .icon-wrap.in   { background: #eef4e8; color: var(--warm-green); }
  .icon-wrap.out  { background: #faeee8; color: var(--warm-red); }
  .icon-wrap.fail { background: #fdf4e0; color: var(--warm-yellow); }

  .entry-action {
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .action.in   { color: var(--warm-green); }
  .action.out  { color: var(--warm-red); }
  .action.fail { color: var(--warm-yellow); }

  .entry-date {
    font-size: 0.75rem;
    color: var(--muted);
  }

  .entry-time {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--brown);
    text-align: right;
  }

  .entry-ist {
    font-size: 0.65rem;
    color: var(--muted);
    text-align: right;
    margin-top: 1px;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 0.9rem;
    background: var(--card);
    border: 1.5px dashed var(--border);
    border-radius: 16px;
  }

  .footer {
    text-align: center;
    margin-top: 40px;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .divider {
    height: 1.5px;
    background: var(--border);
    margin: 32px 0;
    border-radius: 2px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Krishnan Subramaniam Iyer — Attendance</div>
    <div class="badge"><div class="dot"></div>Running</div>
  </header>

  <div class="stats">
    <div class="stat total">
      <div class="stat-label">Total Punches</div>
      <div class="stat-value" id="stat-total">—</div>
    </div>
    <div class="stat week">
      <div class="stat-label">This Week</div>
      <div class="stat-value" id="stat-week">—</div>
    </div>
    <div class="stat fail">
      <div class="stat-label">Failures</div>
      <div class="stat-value" id="stat-fail">—</div>
    </div>
  </div>

  <div class="divider"></div>
  <div class="section-label">Punch History</div>
  <div class="log-list" id="log-list">
    <div class="empty">Loading logs...</div>
  </div>

  <div class="footer">All times in IST &nbsp;·&nbsp; Auto-refreshes every 60s</div>
</div>

<script>
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function toIST(utcStr) {
  const d = new Date(utcStr);
  return new Date(d.getTime() + 5.5 * 60 * 60 * 1000);
}

function fmtTime(ist) {
  let h = ist.getUTCHours(), m = ist.getUTCMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,'0')} ${ampm}`;
}

function fmtDate(ist) {
  return `${DAYS[ist.getUTCDay()]}, ${MONTHS[ist.getUTCMonth()]} ${ist.getUTCDate()}`;
}

async function loadLogs() {
  try {
    const res = await fetch('/punch_log.json?t=' + Date.now());
    if (!res.ok) throw new Error();
    const data = await res.json();
    render(data);
  } catch {
    document.getElementById('log-list').innerHTML =
      '<div class="empty">No punches recorded yet — logs will appear after the first automated punch.</div>';
    ['stat-total','stat-week','stat-fail'].forEach(id =>
      document.getElementById(id).textContent = '0');
  }
}

function render(entries) {
  entries.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));

  const success = entries.filter(e => e.status === 'success');
  const failures = entries.filter(e => e.status === 'failure');
  const weekAgo = new Date(Date.now() - 7*24*60*60*1000);
  const thisWeek = success.filter(e => new Date(e.timestamp) > weekAgo);

  document.getElementById('stat-total').textContent = success.length;
  document.getElementById('stat-week').textContent = thisWeek.length;
  document.getElementById('stat-fail').textContent = failures.length;

  if (!entries.length) {
    document.getElementById('log-list').innerHTML =
      '<div class="empty">No punches recorded yet.</div>';
    return;
  }

  document.getElementById('log-list').innerHTML = entries.map(e => {
    const ist = toIST(e.timestamp);
    const cls = e.status === 'failure' ? 'fail' : (e.action === 'punch_in' ? 'in' : 'out');
    const icon = cls === 'in' ? '→' : cls === 'out' ? '←' : '!';
    const label = cls === 'fail'
      ? `${e.action.replace('_',' ')} failed`
      : (cls === 'in' ? 'Punched in' : 'Punched out');

    return `<div class="entry">
      <div class="icon-wrap ${cls}">${icon}</div>
      <div>
        <div class="entry-action action ${cls}">${label}</div>
        <div class="entry-date">${fmtDate(ist)}</div>
      </div>
      <div>
        <div class="entry-time">${fmtTime(ist)}</div>
        <div class="entry-ist">IST</div>
      </div>
    </div>`;
  }).join('');
}

loadLogs();
setInterval(loadLogs, 60000);
</script>
</body>
</html>
